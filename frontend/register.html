<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IWES Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page has-auth-nav">
    <nav class="navbar">
        <div class="nav-inner">
            <a class="nav-brand" href="index.html" aria-label="IWES Home">
                <span class="brand-mark">IW</span>
                <span>
                    <strong>IWES</strong>
                    <span>Industrial Waste Exchange</span>
                </span>
            </a>

            <div class="nav-actions">
                <a class="button button-ghost" href="index.html">Back to landing</a>
                <a class="button button-primary" href="login.html">Log in</a>
            </div>
        </div>
    </nav>

    <main class="auth-shell">
        <section class="brand-block" aria-label="IWES">
            <div class="brand-mark">IW</div>
            <h1>Create account</h1>
            <p>Begin a structured exchange workspace for your organization.</p>
        </section>

        <section class="card auth-card">
            <form id="registerForm">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input id="name" name="name" type="text" autocomplete="name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" autocomplete="email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" autocomplete="new-password" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone</label>
                    <input id="phone" name="phone" type="tel" autocomplete="tel">
                </div>

                <button class="button button-primary button-wide" type="submit" id="registerButton">Register</button>
            </form>

            <p class="auth-switch">Already registered? <a href="login.html">Log in</a></p>
        </section>
    </main>

    <script src="main.js"></script>
    <script>
        bindRequiredForm(
            document.getElementById("registerForm"),
            document.getElementById("registerButton")
        );

        document.getElementById("registerForm").addEventListener("submit", async (event) => {
            event.preventDefault();

            const button = document.getElementById("registerButton");
            const payload = {
                name: document.getElementById("name").value.trim(),
                email: document.getElementById("email").value.trim(),
                password: document.getElementById("password").value,
                phone: document.getElementById("phone").value.trim(),
            };

            if (!payload.name || !payload.email || !payload.password) {
                showToast("Name, email, and password are required", "error");
                return;
            }

            setButtonLoading(button, true, "Registering...");
            try {
                await apiCall("/auth/register", "POST", payload);
                showToast("Registration successful. Please log in.", "success");
                setTimeout(() => {
                    window.location.href = "login.html";
                }, 850);
            } catch (error) {
                showToast(error.message, "error");
            } finally {
                setButtonLoading(button, false);
            }
        });
    </script>
</body>
</html>
